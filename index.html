<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jovial Moons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap">
  <style>
    :root {
      --bg: #0a0a0f;
      --text: #f5f5f5;
      --accent: #a29dff;        /* periwinkle, from the sky's violet haze */
      --moonlit: #f5f3ff;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system_ui, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    
    .hero {
      position: relative;
      height: 100vh;
      min-height: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      overflow: hidden;
    }
    
    .hero-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 80%;   /* Jupiter's limb low, the sky above for the title */
    }
    
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(10, 10, 15, 0.15) 0%,
        rgba(10, 10, 15, 0.05) 45%,
        rgba(10, 10, 15, 0.55) 100%
      );
    }
    
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px 22vh;          /* above Jupiter's limb */
      max-width: 720px;
    }

    /* Keep text hidden until the web fonts are ready, then fade it in.
       This prevents the jarring font-swap "jitter" on initial load. */
    .logo,
    .tagline,
    .about h2,
    .about p {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .fonts-ready .logo,
    .fonts-ready .tagline,
    .fonts-ready .about h2,
    .fonts-ready .about p {
      opacity: 1;
    }

    /* The .tagline and .about p define their own resting opacity, so restore it. */
    .fonts-ready .tagline { opacity: 1; }
    .fonts-ready .about p { opacity: 0.85; }
    
    .logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 4.2rem;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 1.25rem;
      color: var(--moonlit);
      text-shadow: 0 0 28px rgba(162, 157, 255, 0.55), 0 2px 30px rgba(0, 0, 0, 0.6);
    }
    
    .tagline {
      font-size: 1.35rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
    }
    
    .section {
      padding: 120px 24px;
      max-width: 1080px;
      margin: 0 auto;
    }
    
    .about {
      text-align: center;
    }
    
    .about h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.8rem;
      font-weight: 400;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }
    
    .about p {
      font-size: 1.1rem;
      max-width: 620px;
      margin: 0 auto;
      opacity: 0.85;
      line-height: 1.75;
    }
    
    .footer {
      padding: 60px 24px 40px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.875rem;
      opacity: 0.6;
    }
    
    .footer a.testers {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(162, 157, 255, 0.5);
    }

    .footer a.testers:hover {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 3.1rem;
      }
      .tagline {
        font-size: 1.05rem;
        letter-spacing: 2px;
      }
      .about h2 {
        font-size: 2.2rem;
      }
    }
    /* MOONRISE (owner, 2026-10-30): the hero in layers — the sky, the moons, Jupiter in front — in the picture's own pixels,
       laid over the window as the picture was (cover, centre 80%) by the script below */
    .stage { position: absolute; left: 0; top: 0; width: 3072px; height: 1536px; transform-origin: 0 0; }
    .stage .sky { position: absolute; inset: 0; width: 100%; height: 100%; animation: sky-in 1.6s ease-out both; }
    .moons, .jupiter { position: absolute; inset: 0; will-change: transform; }
    .moon { position: absolute; left: 0; top: 0; will-change: transform, opacity; opacity: 0; }
    .jupiter { animation: planet-rise 2.4s cubic-bezier(.2, .7, .2, 1) .1s both; }
    .planet { position: absolute; left: 837px; top: 854px; width: 1405px; height: 682px; }
    /* the dawn on Jupiter's rim: a glow over the limb, screen-blended so it only ever adds light, that rises with the
       planet and settles. A layer of the stage itself, never inside a moving wrapper — a moving element is its own
       group, and screen would then blend with nothing. The sky has no Jupiter in it: the planet and its glow are
       jupiter.webp alone, so it rises from nothing */
    .rim { position: absolute; left: 885.4px; top: 902.4px; width: 1308.2px; height: 1308.2px; border-radius: 50%;
            box-shadow: 0 0 90px 26px rgba(162, 157, 255, .7); mix-blend-mode: screen;   /* screen: it only ever adds light */
            opacity: .3; animation: planet-rise 2.4s cubic-bezier(.2, .7, .2, 1) .1s backwards, rim-dawn 3.4s ease-out .5s backwards; }
    /* the page is a picture, not a document: a stray drag never selects its words or lifts its art out */
    .hero, .about { -webkit-user-select: none; user-select: none; }
    .stage { pointer-events: none; }
    .stage img { -webkit-user-drag: none; }
    @keyframes sky-in { from { opacity: 0; } }
    @keyframes planet-rise { from { opacity: 0; transform: translateY(90px); } }
    @keyframes rim-dawn { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: .3; } }
    .logo { transform: translateY(14px); transition: opacity 1.2s ease 1s, transform 1.6s cubic-bezier(.2, .7, .2, 1) 1s; }
    .tagline { transition: opacity 1.2s ease 1.6s; }
    .fonts-ready .logo { transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .stage .sky, .jupiter, .rim { animation: none; }
      .rim { opacity: .3; }
      .logo { transform: none; transition: opacity .4s ease; }
      .tagline { transition: opacity .4s ease; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="stage" id="stage" aria-hidden="true">
      <img class="sky" src="sky.jpg" alt="">
      <div class="moons" id="moons"></div>
      <div class="jupiter"><img class="planet" src="jupiter.webp" alt=""></div>
      <div class="rim"></div>
    </div>
    <div class="hero-overlay"></div>
    
    <div class="hero-content">
      <h1 class="logo">Jovial Moons</h1>
      <p class="tagline">Celestial • Timeless • Yours</p>
    </div>
  </section>

  <section class="section about">
    <h2>Under the same sky.</h2>
    <p>
      Jovial Moons makes things for dreamers and players —
      crafted tools and experiences to inspire your imagination.
    </p>
  </section>

  <footer class="footer">
    © Jovial Moons · <a class="testers" href="https://testers.jovialmoons.com/">Testers</a>
  </footer>

  <script>
    // Reveal text once the web fonts have loaded so users never see the
    // fallback-to-webfont swap. Fall back to a timeout if the Font Loading
    // API is unavailable or slow, so text always appears.
    (function () {
      var reveal = function () { document.body.classList.add('fonts-ready'); };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(reveal);
        setTimeout(reveal, 1500);
      } else {
        reveal();
      }
    })();
  </script>
  <script>
    // MOONRISE (owner, 2026-10-30): the moons go round Jupiter. Jupiter's centre is just below the picture, so each orbit's
    // near half is out of sight: a moon rises beside the planet, crosses the sky (a little smaller at the top of its arc,
    // the far side) and sets on the other side — or, an orbit lower than the limb, passes BEHIND Jupiter, which is drawn
    // over the moons. The four big moons are the Galilean ones, Io : Europa : Ganymede kept 1 : 2 : 4 as the real ones
    // are (Laplace resonance), Ganymede in bronze; the small ones are the outer moons, some going the other way round
    // (retrograde, as Jupiter's irregular moons do). Sunlight comes from the left, so every moon's crescent of shade is
    // on its right wherever it is. Transforms and opacity only; still under reduced motion.
    (function () {
      var W = 3072, H = 1536, CX = 1539.5, CY = 1556.5;
      var PAL = {
        lilac:  ['#b7b5ca', '#918eaa'], peri: ['#9b97d7', '#7670ba'], gold: ['#b7a783', '#887a5e'],
        violet: ['#7a73aa', '#58517c'], bronze: ['#c99268', '#94603f']
      };
      // a, b: the orbit's half width and height (picture px); r: the moon's radius; T: seconds round; th: where it starts
      var MOONS = [
        { name: 'Io',       a:  820, b:  566, r: 22, pal: 'gold',   T:  75, th: 2.40 },   // below the limb's top: passes behind Jupiter
        { name: 'Europa',   a: 1060, b:  731, r: 19, pal: 'lilac',  T: 150, th: 0.60 },   // skims the limb
        { name: 'Ganymede', a: 1360, b: 1300, r: 42, pal: 'bronze', T: 300, th: 0.90 },   // crosses above the title
        { name: 'Callisto', a: 1760, b: 1450, r: 34, pal: 'violet', T: 700, th: 2.05 },   // high
        { a: 2500, b: 1500, r: 26, pal: 'peri',   T:  1400, th: 2.09 },
        { a: 2350, b: 1380, r: 13, pal: 'lilac',  T:  1200, th: 0.62 },
        { a: 2000, b: 1420, r: 12, pal: 'lilac',  T:  -900, th: 1.72 },
        { a: 2250, b: 1460, r:  9, pal: 'gold',   T: -1100, th: 1.30 },
        { a: 1600, b: 1300, r: 10, pal: 'lilac',  T:   520, th: 1.20 },
        { a: 1900, b: 1150, r: 14, pal: 'peri',   T:   820, th: 0.42 },
        { a: 1250, b: 1010, r:  8, pal: 'violet', T:  -260, th: 2.55 },
        { a: 2700, b: 1250, r: 11, pal: 'gold',   T:  1600, th: 2.55 }
      ];      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var stage = document.getElementById('stage'), layer = document.getElementById('moons'),
          hero = stage.parentNode;
      var NS = 'http://www.w3.org/2000/svg';
      MOONS.forEach(function (m, i) {
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'moon'); svg.setAttribute('viewBox', '-1 -1 2 2');
        svg.setAttribute('width', 2 * m.r); svg.setAttribute('height', 2 * m.r);
        svg.innerHTML = '<circle r="1" fill="' + PAL[m.pal][1] + '"/><circle cx="-.06" r=".94" fill="' + PAL[m.pal][0] + '"/>';
        layer.appendChild(svg); m.el = svg; m.born = 0.45 + i * 0.11;
      });
      var scale = 1;
      function fit() {
        var vw = hero.clientWidth, vh = hero.clientHeight;
        scale = Math.max(vw / W, vh / H);
        stage.style.transform = 'translate(' + (vw - W * scale) * 0.5 + 'px,' + (vh - H * scale) * 0.8 + 'px) scale(' + scale + ')';
      }
      fit(); addEventListener('resize', fit);
      var t = 0, last = performance.now();
      function draw(now) {
        t += Math.min(0.1, (now - last) / 1000); last = now;
        for (var i = 0; i < MOONS.length; i++) {
          var m = MOONS[i], th = m.th + (still ? 0 : 2 * Math.PI * t / m.T);
          var s = Math.sin(th), x = CX + m.a * Math.cos(th), y = CY - m.b * s, k = 1 - 0.1 * s;
          m.el.style.transform = 'translate(' + (x - m.r) + 'px,' + (y - m.r) + 'px) scale(' + k + ')';
          m.el.style.opacity = still ? 1 : Math.min(1, Math.max(0, (t - m.born) / 0.9));
        }
        if (!still) requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
